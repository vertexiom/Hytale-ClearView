<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClearView — prévia do instalador</title>
<style>
:root{color-scheme:dark;--ink:#e6edf5;--muted:#a8b9cb;--accent:#8dd2f4;--green:#85d8af;--amber:#f0c782;--paper:#1b2838;--edge:#304357;font-family:Inter,'Segoe UI',system-ui,sans-serif;color:var(--ink);background:#0c131d;font-size:14px}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-content:center;padding:32px 20px;gap:20px;background:radial-gradient(ellipse at 45% 20%,#1b2d40 0,transparent 65%)}button,input,select{font:inherit}button,select{cursor:pointer}button{border:1px solid transparent;border-radius:14px;padding:11px 21px;background:#2a3b4e;color:var(--ink);font-weight:600;transition:background .15s,transform .15s}button:hover:not(:disabled){background:#36516a}button:active:not(:disabled){transform:translateY(1px)}button:disabled{opacity:.4;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:4px}.primary{background:var(--accent);color:#092132}.primary:hover:not(:disabled){background:#b4e5ff}.warning{background:var(--amber);color:#30220c}.warning:hover:not(:disabled){background:#ffe0aa}.link{padding:0;background:none!important;color:var(--accent);text-align:left;font-size:13px}.link:hover{text-decoration:underline}.lab{width:min(960px,calc(100vw - 40px));display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.lab-title{display:flex;align-items:center;gap:12px}.badge{font-size:10px;font-weight:700;letter-spacing:1.3px;padding:7px 10px;border:1px solid #3b5268;border-radius:20px;color:var(--accent)}.lab p{margin:0;font-size:12px;color:var(--muted)}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.controls label{font-size:12px;color:var(--muted)}select{border:1px solid var(--edge);background:#152131;color:var(--ink);border-radius:10px;padding:9px;max-width:240px}.controls button{font-size:12px;padding:9px 13px}.window{width:min(960px,calc(100vw - 40px));border:1px solid #304052;border-radius:22px;overflow:hidden;background:var(--paper);box-shadow:0 30px 90px #0007}.titlebar{height:42px;background:#151e2a;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:12px}.close{background:none;padding:4px 10px;border-radius:8px;font-size:20px;font-weight:400}.body{display:grid;grid-template-columns:340px 1fr;min-height:510px}.art{position:relative;overflow:hidden;background:#071018;min-height:510px}.brand{position:absolute;top:29px;left:26px;font-size:11px;letter-spacing:2px;font-weight:600;color:#8ca7b8;z-index:1}.art canvas{width:100%;height:100%;display:block;position:absolute;inset:0}.version{position:absolute;bottom:24px;left:26px;font-size:11px;color:#8ca7b8}.content{padding:38px 40px 28px;display:flex;flex-direction:column;align-items:flex-start;gap:20px;min-width:0}.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--accent);margin:0}h1{font-size:32px;line-height:1.17;letter-spacing:-1px;margin:0;font-weight:650;outline:none}h1.hero{font-size:42px}p{line-height:1.65;margin:0}.desc{font-size:15px;color:var(--muted)}.small{font-size:13px;color:var(--muted)}.grow{flex:1}.success{color:var(--green)}.attention{color:var(--amber)}.field{width:100%;display:grid;gap:10px}.field label{font-size:11px;font-weight:650;letter-spacing:.8px;color:var(--accent)}input{width:100%;min-width:0;padding:13px;background:#121d2a;border:1px solid #3a5064;border-radius:12px;color:var(--ink);font-size:12px}.folder-row{display:flex;gap:10px;width:100%;align-items:center}.folder-row input{flex:1}.folder-row button{padding:12px 14px}.notice{background:#243647;border-radius:16px;padding:18px;width:100%;font-size:13px;color:var(--muted)}.success-card{background:#17352f;border:1px solid #285144;border-radius:18px;padding:24px;width:100%;display:grid;gap:12px}.key{font-size:40px;color:var(--green);font-weight:600}.steps{list-style:none;padding:0;margin:4px 0;width:100%;display:grid;gap:18px}.steps li{display:flex;gap:14px;align-items:center;color:var(--muted)}.steps .current{color:var(--ink)}.steps .done{color:var(--green)}.step-num{border-radius:50%;width:28px;height:28px;display:grid;place-items:center;background:#2a3d50;font-size:12px}.done .step-num{background:#21473c}.current .step-num{background:var(--accent);color:#092132}.progress{height:7px;width:100%;background:#2b3d4f;border-radius:10px;overflow:hidden}.progress span{display:block;width:35%;height:100%;background:var(--accent);border-radius:10px;animation:slide 1.7s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(286%)}}footer{background:#151e2a;border-top:1px solid #293748;min-height:72px;display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:14px 24px}.footer-status{margin-right:auto;color:var(--muted);font-size:12px}details{width:100%;color:var(--muted);font-size:12px}summary{cursor:pointer;color:var(--accent)}details p{margin-top:10px}.hint{text-align:center;color:#8197aa;font-size:12px}.paused .progress span{animation-play-state:paused}@media(prefers-reduced-motion:reduce){*{transition:none!important}.progress span{animation:none;width:100%;opacity:.55}}@media(max-width:760px){body{padding:16px 12px}.lab,.window{width:calc(100vw - 24px)}.body{grid-template-columns:1fr}.art{min-height:230px}.brand{top:20px}.version{bottom:14px}.content{min-height:450px;padding:28px 24px}h1.hero{font-size:36px}.hint{max-width:90vw}footer{flex-wrap:wrap;padding:14px 18px}.lab{gap:16px}.controls{width:100%}}
</style>
<div class="lab">
 <div class="lab-title"><span class="badge">PRÉVIA LOCAL</span><p>Nenhum arquivo do jogo será alterado.</p></div>
 <div class="controls"><label for="scenario">Cenário</label><select id="scenario"><option value="normal">Instalação com sucesso</option><option value="missing">Hytale não encontrado</option><option value="graphics">Falha na verificação gráfica</option><option value="running">Hytale aberto</option><option value="installed">Atualizar instalação existente</option><option value="remove">Remover ClearView</option></select><button id="restart">Reiniciar</button><button id="motion" aria-pressed="false">Pausar chuva</button></div>
</div>
<main class="window" aria-label="Simulação do instalador ClearView">
 <header class="titlebar"><span>ClearView Setup</span><button class="close" aria-label="Fechar instalador simulado" id="close">×</button></header>
 <div class="body"><aside class="art" aria-label="Clear View em ASCII com chuva animada"><canvas id="rain" aria-hidden="true"></canvas><div class="brand">CLEARVIEW / VERTEXIOM</div><div class="version">v0.1.2 · em desenvolvimento</div></aside><section class="content" id="content" aria-labelledby="heading"></section></div>
 <footer id="footer"></footer>
</main>
<p class="hint">Simulação visual · A pasta, a verificação e a instalação são fictícias. Funciona offline.</p>
<script>
'use strict';
const $=s=>document.querySelector(s), content=$('#content'),footer=$('#footer');
const defaultPath='C:\\Users\\Player\\AppData\\Roaming\\Hytale\\install\\release\\package\\game\\latest\\Client';
let screen='welcome',scenario='normal',folder=defaultPath,found=true,gameOpen=false,operation='install',timer=null,stage=0;
function stop(){clearTimeout(timer);timer=null}
function button(label,action,style='',disabled=false){const b=document.createElement('button');b.textContent=label;b.className=style;b.disabled=disabled;b.addEventListener('click',action);return b}
function actions(items){footer.replaceChildren(...items)}
function base(step,title,desc,kind=''){content.innerHTML=`<p class="eyebrow ${kind}">${step}</p><h1 id="heading" tabindex="-1" class="${kind}">${title}</h1><p class="desc">${desc}</p>`}
function add(html){content.insertAdjacentHTML('beforeend',html)}
function focusHeading(){$('#heading').focus({preventScroll:true})}
function show(next){stop();screen=next;
 if(next==='welcome'){
 base('01 / 04 · BEM-VINDO','Seu mundo,<br>mais à vista.','Ajuste a neblina do Hytale sem mudar a iluminação original do jogo.');$('#heading').classList.add('hero');add('<p>Feche o jogo antes de continuar.<br>O Hytale precisa estar instalado.</p><div class="grow"></div>');content.append(button('Já usa o ClearView? Remover instalação',()=>show('remove'),'link'));actions([button('Cancelar',()=>show('closed')),button('Continuar',()=>show('location'),'primary')]);
 }else if(next==='location'){
 base('02 / 04 · LOCAL DO JOGO',found?'Onde está o Hytale?':'Vamos localizar o jogo.',found?'O ClearView será instalado na pasta do seu jogo.':'Não encontramos uma instalação do Hytale nesta pasta.',found?'':'attention');
 add('<div class="field"><label for="path">PASTA DO HYTALE</label><div class="folder-row"><input id="path" aria-label="Pasta simulada do Hytale" spellcheck="false"><button id="browse">Procurar</button></div></div>');$('#path').value=folder;$('#path').addEventListener('input',e=>folder=e.target.value);$('#browse').onclick=()=>show('browse');
 add(found?'<p class="small success">✓ Encontramos os arquivos necessários.</p>':'<p class="small">Se o Hytale já está instalado, selecione a pasta do cliente. Caso contrário, instale o jogo pelo launcher primeiro.</p>');
 if(gameOpen)add('<div class="notice"><strong class="attention">O Hytale está aberto.</strong><br>Feche o jogo antes de continuar.</div>');
 if(!found||gameOpen)content.append(button(gameOpen?'Simular jogo fechado':'Verificar novamente',()=>{if(gameOpen)gameOpen=false;show('location')},'link'));
 actions([button('Voltar',()=>show('welcome')),button('Cancelar',()=>show('closed')),button(scenario==='installed'?'Atualizar':'Instalar',()=>begin('install'),'primary',!found||gameOpen)]);
 }else if(next==='browse'){
 base('ESCOLHER PASTA · SIMULAÇÃO','Selecione o local do jogo.','Esta prévia usa uma pasta fictícia, sem acessar seu computador.');add('<div class="field"><label for="selected-path">PASTA DE EXEMPLO</label><input id="selected-path" spellcheck="false"></div>');$('#selected-path').value=folder||defaultPath;actions([button('Voltar',()=>show('location')),button('Usar esta pasta',()=>{folder=$('#selected-path').value.trim();if(!folder){$('#selected-path').focus();return}found=true;show('location')},'primary')]);
 }else if(next==='remove'){
 base('REMOVER CLEARVIEW','Remover o ClearView?','O mod será removido desta instalação do Hytale.','attention');add('<p class="desc">O jogo voltará a usar seus arquivos originais. Feche o Hytale antes de continuar.</p><div class="notice">A remoção só começa quando você clicar em <strong>Remover</strong>.</div>');if(gameOpen){add('<p class="attention small">O Hytale está aberto.</p>');content.append(button('Simular jogo fechado',()=>{gameOpen=false;show('remove')},'link'))}actions([button('Voltar',()=>show('welcome')),button('Remover',()=>begin('remove'),'warning',gameOpen)]);
 }else if(next==='error'){
 base('INSTALAÇÃO INTERROMPIDA','Não foi possível concluir.','A verificação gráfica não terminou com sucesso.','attention');add('<p class="desc">Feche o Hytale e tente novamente. Se o problema continuar, envie uma mensagem no Discord.</p><p style="color:var(--accent)">Discord: tallmannzera</p><details><summary>Ver detalhes desta tentativa</summary><p>Relatório de demonstração: falha simulada na etapa 2, verificação gráfica. Nenhum teste real foi executado.</p></details><p class="small">O ClearView não foi instalado nesta tentativa.</p>');actions([button('Voltar',()=>show('location')),button('Fechar',()=>show('closed')),button('Tentar novamente',()=>begin('install'),'primary')]);
 }else if(next==='complete'){
 base('04 / 04 · CONCLUÍDO',operation==='remove'?'Remoção concluída.':'Tudo pronto!',operation==='remove'?'O ClearView foi removido nesta simulação.':'O ClearView foi instalado com sucesso nesta simulação.','success');add(operation==='remove'?'<div class="success-card"><p>Você pode voltar a instalar o ClearView quando quiser.</p></div>':'<div class="success-card"><span class="key">F9</span><p>Abra o Hytale pelo launcher. Dentro do jogo, pressione F9 para ajustar a neblina.</p></div>');add('<p class="small">Clique em Concluir para fechar o instalador.</p>');actions([button('Concluir',()=>show('closed'),'primary')]);
 }else if(next==='closed'){
 base('PRÉVIA ENCERRADA','Até a próxima.','A simulação foi encerrada. Nenhum arquivo foi alterado.');add('<p class="desc">Quer experimentar outro caminho? Escolha um cenário acima ou reinicie a prévia.</p>');actions([button('Reabrir instalador',reset,'primary')]);
 }focusHeading();
}
function begin(op){stop();operation=op;screen='progress';stage=0;renderProgress();focusHeading();advance()}
function renderProgress(){const labels=operation==='remove'?['Verificar instalação','Restaurar arquivos originais','Finalizar remoção']:['Verificar arquivos','Testar compatibilidade gráfica','Instalar arquivos'];base('03 / 04 · '+(operation==='remove'?'REMOÇÃO':'INSTALAÇÃO'),operation==='remove'?'Restaurando o jogo.':'Preparando sua visão.',operation==='remove'?'Aguarde enquanto o ClearView é removido.':'Estamos preparando o ClearView para o seu jogo.');add('<ol class="steps">'+labels.map((s,i)=>`<li class="${i<stage?'done':i===stage?'current':''}"><span class="step-num">${i<stage?'✓':i+1}</span><span>${s}</span></li>`).join('')+'</ol><div class="progress" role="progressbar" aria-label="'+labels[stage]+'"><span></span></div><p class="small" role="status">'+labels[stage]+'…</p>');const status=document.createElement('p');status.className='footer-status';status.textContent='Aguarde a conclusão da operação.';actions([status])}
function advance(){timer=setTimeout(()=>{if(scenario==='graphics'&&operation==='install'&&stage===1){show('error');return}stage++;if(stage===3){show('complete');return}renderProgress();advance()},[1800,3200,2200][stage])}
function reset(){stop();scenario=$('#scenario').value;folder=defaultPath;found=scenario!=='missing';gameOpen=scenario==='running';show(scenario==='remove'?'remove':'welcome')}
$('#restart').onclick=reset;$('#scenario').onchange=reset;$('#close').onclick=()=>{if(screen==='progress'){$('.footer-status').textContent='Aguarde: a operação precisa terminar antes de fechar.';return}show('closed')};
// ASCII rain drawn at device resolution; time-based motion is independent of refresh rate.
const canvas=$('#rain'),ctx=canvas.getContext('2d'),media=matchMedia('(prefers-reduced-motion: reduce)');let paused=media.matches,w=0,h=0,drops=[],splashes=[],last=0,emit=0,cells=[],cw=0,ch=0,floorY=0;
const banner=["  ___ _               __   ___            "," / __| |___ __ _ _ _  \\ \\ / (_)_____ __ __","| (__| / -_) _` | '_|  \\ V /| / -_) V  V /"," \\___|_\\___\\__,_|_|     \\_/ |_\\___|\\_/\\_/ "];
function resize(){const r=canvas.getBoundingClientRect();w=r.width;h=r.height;const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);cw=Math.min((w-30)/43,9);ch=cw*1.95;floorY=h-77;const left=(w-43*cw)/2,top=(65+floorY-banner.length*ch)/2;cells=[];banner.forEach((line,y)=>[...line].forEach((c,x)=>{if(c!==' ')cells.push({x:left+x*cw,y:top+y*ch,c})}));drops=[];splashes=[];for(let i=0;i<60;i++)drops.push(drop(Math.random()*(floorY-70)+70));draw(0)}
function drop(y=65){const depth=.6+Math.random()*.7;return{x:Math.random()*w-35,y,speed:105*depth,depth}}
function splash(x,y){for(const sign of [-1,1])splashes.push({x,y,vx:sign*(12+Math.random()*18),vy:-24-Math.random()*12,life:.45})}
function draw(dt){ctx.clearRect(0,0,w,h);ctx.font='800 '+(cw*1.65)+'px "JetBrains Mono",monospace';ctx.textBaseline='top';emit+=dt*65;while(emit>=1){drops.push(drop());emit--}for(let i=drops.length-1;i>=0;i--){const d=drops[i],old=d.y;d.y+=d.speed*dt;d.x+=d.speed*.24*dt;let hit=d.y>=floorY?floorY:null;if(hit===null)for(const c of cells){if(d.x>=c.x-cw*.45&&d.x<c.x+cw&&old<=c.y+ch*.4&&d.y>=c.y){hit=c.y;break}}if(hit!==null){if(dt)splash(d.x,hit);drops.splice(i,1);continue}ctx.fillStyle=`rgba(119,181,216,${.25+d.depth*.35})`;ctx.fillText('\\',d.x,d.y)}ctx.fillStyle='#d0eefb';for(const c of cells)ctx.fillText(c.c,c.x,c.y);ctx.fillStyle='#527d93';for(let x=12;x<w-12;x+=cw)ctx.fillText('_',x,floorY);for(let x=16;x<w-12;x+=cw*7)ctx.fillText('.',x,floorY+ch*1.4);for(let i=splashes.length-1;i>=0;i--){const p=splashes[i];p.life-=dt;if(p.life<=0){splashes.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=150*dt;ctx.fillStyle=`rgba(168,217,240,${p.life/.45})`;ctx.fillText(p.life>.3?"'":'.',p.x,p.y)}}
function loop(t){const dt=Math.min((t-last)/1000||0,.035);last=t;if(!paused&&!document.hidden)draw(dt);requestAnimationFrame(loop)}
function motionLabel(){$('#motion').textContent=paused?'Animar chuva':'Pausar chuva';$('#motion').setAttribute('aria-pressed',String(paused))}
$('#motion').onclick=()=>{paused=!paused;motionLabel()};media.addEventListener('change',e=>{paused=e.matches;motionLabel()});new ResizeObserver(resize).observe(canvas);motionLabel();reset();requestAnimationFrame(loop);
</script>
</html>
